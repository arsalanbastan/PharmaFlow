name: Price increase development checks
on:
  workflow_dispatch:
  push:
    branches: [release/price-increase-liara-20261110, release/manager-orders-invoices-20261113, release/staff-invoices-android-20261114]
  pull_request:
    paths: ['apps/mobile/**', 'apps/staff/**', 'packages/price_increases_ui/**', 'packages/sales_invoices_ui/**', 'backend/pharmaflow-api/**', '.github/workflows/price-increase-checks.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pharmaflow_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/pharmaflow_test
    defaults:
      run:
        working-directory: backend/pharmaflow-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/pharmaflow-api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand price-increases orders auth sales-invoices staff-settings
      - run: npx prisma migrate deploy
      - run: node test/price-increases.integration.cjs
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
      - run: flutter pub get
        working-directory: packages/price_increases_ui
      - run: flutter test
        working-directory: packages/price_increases_ui
      - run: flutter pub get
        working-directory: apps/staff
      - run: flutter analyze --no-pub --no-fatal-infos
        working-directory: apps/staff
      - run: flutter build web --release --base-href /staff/
        working-directory: apps/staff
      - uses: actions/upload-artifact@v4
        with:
          name: staff-web-for-liara
          path: apps/staff/build/web/
          if-no-files-found: error
      - run: flutter test
        working-directory: apps/staff
      - run: flutter build apk --debug
        working-directory: apps/staff
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze --no-pub --no-fatal-infos lib/features/price_increases lib/features/orders lib/features/sales_invoices lib/core/router/app_router.dart lib/features/menu/presentation/pages/menu_page.dart
        working-directory: apps/mobile
      # This temporary Firebase configuration is used only for the debug
      # compile check. It does not connect to production Firebase and is
      # not suitable for installation or functional acceptance testing.
      - name: Generate CI-only Firebase stub for manager debug compilation
        run: |
          mkdir -p apps/mobile/android/app/src/debug
          cat > apps/mobile/android/app/src/debug/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "123456789012",
              "project_id": "pharmaflow-ci-only-placeholder",
              "storage_bucket": "pharmaflow-ci-only-placeholder.appspot.com"
            },
            "client": [{
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:0000000000000000",
                "android_client_info": {
                  "package_name": "com.example.pharmaflow.dev"
                }
              },
              "oauth_client": [],
              "api_key": [{"current_key": "AIzaSyAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          EOF
      - name: Compile manager debug APK (CI stub; not for deployment)
        run: flutter build apk --debug
        working-directory: apps/mobile
