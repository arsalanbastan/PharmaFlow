name: Price increase development checks
on:
  workflow_dispatch:
  push:
    branches: [feature/price-increase-management]
  pull_request:
    paths: ['apps/mobile/**', 'apps/staff/**', 'packages/price_increases_ui/**', 'backend/pharmaflow-api/**', '.github/workflows/price-increase-checks.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pharmaflow_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/pharmaflow_test
    defaults:
      run:
        working-directory: backend/pharmaflow-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/pharmaflow-api/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand price-increases orders auth
      - run: npx prisma migrate deploy
      - run: node test/price-increases.integration.cjs
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
      - run: flutter pub get
        working-directory: packages/price_increases_ui
      - run: flutter test
        working-directory: packages/price_increases_ui
      - run: flutter pub get
        working-directory: apps/staff
      - run: flutter analyze --no-pub --no-fatal-infos
        working-directory: apps/staff
      - run: flutter build web --release
        working-directory: apps/staff
      - run: flutter build apk --debug
        working-directory: apps/staff
      - run: flutter pub get
        working-directory: apps/mobile
      - run: flutter analyze --no-pub --no-fatal-infos lib/features/price_increases lib/core/router/app_router.dart lib/features/menu/presentation/pages/menu_page.dart
        working-directory: apps/mobile
      - run: flutter build apk --debug
        working-directory: apps/mobile
