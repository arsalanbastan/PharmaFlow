name: Staff Web Invoice Redesign Checks

on:
  push:
    branches:
      - feature/staff-web-invoice-redesign-20261018
  pull_request:
    branches:
      - main
    paths:
      - 'apps/staff/**'
      - 'backend/pharmaflow-api/**'
      - '.github/workflows/staff-web-invoice-checks.yml'

jobs:
  staff-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        working-directory: apps/staff
        run: flutter pub get
      - name: Analyze Staff app
        working-directory: apps/staff
        run: flutter analyze --no-pub
      - name: Build Staff web
        working-directory: apps/staff
        run: flutter build web --release

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/pharmaflow-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/pharmaflow-api/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Build backend
        run: npm run build
      - name: Run sales invoice tests
        run: npm test -- --runInBand sales-invoices
