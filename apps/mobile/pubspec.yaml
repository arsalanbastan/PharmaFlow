name: pharmaflow
description: Modern Pharmacy Financial Commitment Management System

publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ==========================
  # State Management
  # ==========================
  flutter_riverpod: ^2.6.1

  # ==========================
  # Routing
  # ==========================
  go_router: ^16.3.0

  # ==========================
  # Localization & Formatting
  # ==========================
  intl: ^0.20.2
  shamsi_date: ^1.1.1

  # ==========================
  # Networking
  # ==========================
  dio: ^5.10.0
  http: ^1.5.0

  # ==========================
  # Models
  # ==========================
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ==========================
  # SQLite
  # ==========================
  sqlite3: ^2.9.3
  sqlite3_flutter_libs: ^0.5.42

  # ==========================
  # Utilities
  # ==========================
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  share_plus: ^11.1.0
  image_picker: ^1.1.2
  font_awesome_flutter: ^11.0.0
  excel: ^4.0.6
  

  # ==========================
  # Secure Storage
  # ==========================
  flutter_secure_storage: ^9.2.4

  # ==========================
  # Logging
  # ==========================
  logger: ^2.7.0
  material_drum_picker:
    git:
      url: https://github.com/sayed3li97/material_drum_picker.git

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # ==========================
  # Code Generation
  # ==========================
  build_runner: ^2.5.4
  freezed: ^3.2.5
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800